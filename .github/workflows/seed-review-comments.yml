name: Seed Review Comments
on:
  workflow_dispatch:
    inputs:
      comments_json:
        description: 'JSON array of review comments to post'
        required: true
        type: string

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Post review comments
        uses: actions/github-script@v7
        env:
          COMMENTS_JSON: ${{ inputs.comments_json }}
        with:
          script: |
            const comments = JSON.parse(process.env.COMMENTS_JSON);
            for (const c of comments) {
              try {
                if (c.file && c.line) {
                  await github.rest.pulls.createReview({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: c.pr_number,
                    commit_id: c.commit_id,
                    body: 'Bot review.',
                    event: 'COMMENT',
                    comments: [{
                      path: c.file,
                      line: c.line,
                      side: c.side || 'RIGHT',
                      body: c.body,
                    }],
                  });
                } else {
                  await github.rest.pulls.createReview({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: c.pr_number,
                    commit_id: c.commit_id,
                    body: c.body,
                    event: 'COMMENT',
                  });
                }
                console.log('Posted comment on PR #' + c.pr_number);
              } catch (err) {
                console.error('Failed on PR #' + c.pr_number + ': ' + err.message);
                try {
                  await github.rest.pulls.createReview({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: c.pr_number,
                    commit_id: c.commit_id,
                    body: c.file ? '[' + c.file + '] ' + c.body : c.body,
                    event: 'COMMENT',
                  });
                  console.log('Fallback posted on PR #' + c.pr_number);
                } catch (err2) {
                  console.error('Fallback also failed: ' + err2.message);
                }
              }
            }
