name: Seed Review Comments
on:
  workflow_dispatch:
    inputs:
      comments_json:
        description: 'JSON array of review comments to post'
        required: true
        type: string

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Post review comments
        uses: actions/github-script@v7
        with:
          script: |
            const comments = JSON.parse(`${{ inputs.comments_json }}`);
            for (const c of comments) {
              try {
                if (c.file && c.line) {
                  // Post as a single-comment review (inline)
                  await github.rest.pulls.createReview({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: c.pr_number,
                    commit_id: c.commit_id,
                    body: 'Bot review.',
                    event: 'COMMENT',
                    comments: [{
                      path: c.file,
                      line: c.line,
                      side: c.side || 'RIGHT',
                      body: c.body,
                    }],
                  });
                } else {
                  // Post as a review body comment
                  await github.rest.pulls.createReview({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: c.pr_number,
                    commit_id: c.commit_id,
                    body: c.body,
                    event: 'COMMENT',
                  });
                }
                console.log(`Posted comment on PR #${c.pr_number}`);
              } catch (err) {
                console.error(`Failed to post on PR #${c.pr_number}: ${err.message}`);
                // Try fallback without inline positioning
                try {
                  await github.rest.pulls.createReview({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: c.pr_number,
                    commit_id: c.commit_id,
                    body: c.file ? `[${c.file}] ${c.body}` : c.body,
                    event: 'COMMENT',
                  });
                  console.log(`Fallback posted on PR #${c.pr_number}`);
                } catch (err2) {
                  console.error(`Fallback also failed: ${err2.message}`);
                }
              }
            }
